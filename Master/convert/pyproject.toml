[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpine-convert"
version = "1.0.0"
description = "Bidirectional ALPINE waveform conversion with local and Slurm workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "uproot>=5.0",
]

[project.scripts]
alpine-convert = "alpine_convert.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
